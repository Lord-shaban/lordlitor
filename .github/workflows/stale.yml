name: Stale Issues

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6 AM UTC

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: 🧹 Close Stale Issues
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          stale-issue-message: >
            هذا الـ Issue لم يشهد أي نشاط خلال 30 يوماً.
            سيتم إغلاقه تلقائياً بعد 7 أيام إذا لم يكن هناك تحديث.
            إذا كان لا يزال مهماً، يرجى إضافة تعليق.
          stale-pr-message: >
            هذا الـ PR لم يشهد أي نشاط خلال 14 يوماً.
            سيتم إغلاقه تلقائياً بعد 7 أيام إذا لم يكن هناك تحديث.
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          days-before-stale: 30
          days-before-close: 7
          days-before-pr-stale: 14
          days-before-pr-close: 7
          exempt-issue-labels: 'priority: high,feature'
          exempt-pr-labels: 'priority: high'
