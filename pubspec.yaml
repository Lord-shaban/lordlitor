name: lordlitor
description: "تطبيق تدريب القدرات الذهنية - Mental Abilities Training App"
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  shared_preferences: ^2.3.4
  flutter_animate: ^4.5.2
  confetti: ^0.8.0
  percent_indicator: ^4.2.3
  fl_chart: ^0.70.2
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5

flutter:
  uses-material-design: true
  assets:
    - lib/image/

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
  image_path: "lib/image/logo.jpg"
  min_sdk_android: 21

flutter_native_splash:
  color: "#58CC02"
  image: lib/image/logo_without_bg.png
  android_12:
    color: "#58CC02"
    image: lib/image/logo_without_bg.png
